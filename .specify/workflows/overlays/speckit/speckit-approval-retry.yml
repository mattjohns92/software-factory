id: speckit-approval-retry
extends: speckit
priority: 10
enabled: true
edits:
- replace: review-spec
  step:
    id: review-spec
    type: gate
    verdict_input: speckit_review_spec_verdict
    message: Review the generated spec before planning.
    options:
    - approve
    - reject
    on_reject: retry
- replace: review-plan
  step:
    id: review-plan
    type: gate
    verdict_input: speckit_review_plan_verdict
    message: Review the plan before generating tasks.
    options:
    - approve
    - reject
    on_reject: retry
